name: Preview

# Every commit on main publishes a preview package for developers: the Docker image as its own package ghcr.io/<owner>/kyuplan-preview,
# tagged with the commit (sha-<7 characters>) and "main" (always the latest commit). It has nothing to do with the releases: they push
# ghcr.io/<owner>/kyuplan from a tag (release.yml) and never see these tags. Like the release's image it carries the installers of the
# desktop client and the APK, but unsigned (see pr-build.yml); the version is 0.0.0-preview.<run number>.
# Every commit gets its package, so a run is never cancelled by the next one. Old versions stay until they are deleted under the
# repository's Packages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preview
  cancel-in-progress: false

jobs:
  clients:
    uses: ./.github/workflows/build-clients.yml
    with:
      version: 0.0.0-preview.${{ github.run_number }}

  image:
    needs: clients
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          merge-multiple: true
          path: artifacts/installer

      - name: Work out the image name
        id: image
        run: |
          # Registry paths are lower case, owners are not.
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kyuplan-preview"
          {
            echo "name=$image"
            echo "tags<<EOF"
            echo "$image:sha-${GITHUB_SHA::7}"
            echo "$image:main"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/Kyuplan.Api/Dockerfile
          build-contexts: installer=artifacts/installer
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            VERSION=0.0.0-preview.${{ github.run_number }}
            DOCS_REPO_REF=main
            REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=0.0.0-preview.${{ github.run_number }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Preview package"
            echo
            echo "\`docker pull ${{ steps.image.outputs.name }}:sha-${GITHUB_SHA::7}\`"
          } >> "$GITHUB_STEP_SUMMARY"
