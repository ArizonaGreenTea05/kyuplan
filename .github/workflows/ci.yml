name: CI

# Every pull request builds and tests everything: the server (API), the clients (web and WPF) and the documentation.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Windows, because the solution includes the WPF client and the tests cover its Windows-only encrypted login file.
  build-test:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build server and clients
        run: dotnet build -c Release

      - name: Test
        run: dotnet test tests/Kyuplan.Tests -c Release

  # The tests marked PostgresFact (case-insensitive names, decimal amounts, the migrations) need a real server; locally they are skipped.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust # throwaway container, only reachable from this job
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KYUPLAN_TEST_POSTGRES: Host=localhost;Username=postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Test against PostgreSQL
        run: dotnet test tests/Kyuplan.Tests -c Release --filter "FullyQualifiedName~PostgresApiTests"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the documentation
        working-directory: website
        run: |
          npm ci --no-audit --no-fund
          node scripts/build-all.mjs

  # The image the server ships in (API + web client + documentation), built but not pushed. One platform is enough here:
  # the Dockerfile cross-compiles, and the release builds both. Its "installer" stage is empty without the release's installers.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Kyuplan.Api/Dockerfile
          platforms: linux/amd64
          push: false
