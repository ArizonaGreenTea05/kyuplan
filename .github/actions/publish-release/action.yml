name: Publish release
description: >
  Publishes the GitHub release of the tag that started the workflow, with generated notes that start at the previous version tag.
  A release of that tag that already exists (the workflow was run again, or the tag was deleted and pushed again; deleting a tag
  turns its release into a draft) is updated and published instead of created, and its files are replaced. Nothing is deleted.

inputs:
  title:
    description: Title of the release.
    required: true
  notes:
    description: Notes written in front of the generated ones.
    required: true
  prerelease:
    description: '"true" for a pre-release.'
    required: true
  previous-tag:
    description: The tag the generated notes start at, empty for the first release.
    default: ''
  files:
    description: Paths (or patterns like artifacts/installer/*) of the files to attach to the release, separated by spaces; empty for none.
    default: ''

runs:
  using: composite
  steps:
    - shell: bash
      env:
        TITLE: ${{ inputs.title }}
        NOTES: ${{ inputs.notes }}
        PRERELEASE: ${{ inputs.prerelease }}
        PREVIOUS_TAG: ${{ inputs.previous-tag }}
        FILES: ${{ inputs.files }}
        GH_TOKEN: ${{ github.token }}
      run: |
        # The list also holds drafts, which gh release view does not find by their tag. Several drafts can share a tag: the first one is used.
        ids=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.tag_name == env.GITHUB_REF_NAME) | .id')
        id="${ids%%$'\n'*}"

        if [ -z "$id" ]; then
          args=(--title "$TITLE" --notes "$NOTES" --generate-notes --verify-tag)
          [ -n "$PREVIOUS_TAG" ] && args+=(--notes-start-tag "$PREVIOUS_TAG")
          [ "$PRERELEASE" = true ] && args+=(--prerelease)
          # Unquoted on purpose: a pattern is expanded here.
          # shellcheck disable=SC2206
          [ -n "$FILES" ] && args+=($FILES)
          gh release create "$GITHUB_REF_NAME" "${args[@]}"
          exit 0
        fi

        echo "The release of $GITHUB_REF_NAME exists already (id $id): updating it."
        notes_args=(-f tag_name="$GITHUB_REF_NAME")
        [ -n "$PREVIOUS_TAG" ] && notes_args+=(-f previous_tag_name="$PREVIOUS_TAG")
        generated=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${notes_args[@]}" --jq .body)
        gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
          -f name="$TITLE" -f body="$NOTES"$'\n\n'"$generated" -F prerelease="$PRERELEASE" -F draft=false > /dev/null
        if [ -n "$FILES" ]; then
          # shellcheck disable=SC2086
          gh release upload "$GITHUB_REF_NAME" $FILES --clobber
        fi
