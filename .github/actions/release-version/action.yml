name: Release version
description: >
  Reads the version out of the "v<version>" tag that started the workflow (v0.1 -> 0.1, v1.2.3 -> 1.2.3), fails if the tag is not
  of that form, and finds the previous version tag, which the release notes start from.

outputs:
  version:
    description: The version without the "v" of the tag, e.g. 0.1, 1.2.3 or 1.2.3-beta.1.
    value: ${{ steps.read.outputs.version }}
  prerelease:
    description: "true when the version has a prerelease suffix (-beta.1), otherwise false."
    value: ${{ steps.read.outputs.prerelease }}
  previous-tag:
    description: The previous version tag, empty for the first one.
    value: ${{ steps.read.outputs.previous-tag }}
  codename:
    description: The name of the major version, e.g. "Swift Crane". Every release of a major carries the same name; each new major gets another one.
    value: ${{ steps.read.outputs.codename }}

runs:
  using: composite
  steps:
    - id: read
      shell: bash
      env:
        TAG: ${{ github.ref_name }}
        GH_TOKEN: ${{ github.token }}
      run: |
        version="$TAG"
        if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
          echo "::error::The tag '$TAG' is not of the form v<major>.<minor>[.<patch>][-<prerelease>], for example v0.1 or v1.2.3."
          exit 1
        fi
        version="${version#v}"

        prerelease=false
        [[ "$version" == *-* ]] && prerelease=true

        # The tag just before this one among the version tags (the API is asked, so no full clone is needed). Older per-app tags like api/v0.1 do not match.
        previous=$(gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref' \
          | sed 's#^refs/tags/##' | sort -V | grep -x -F -B1 -- "$TAG" | head -n1 || true)
        [[ "$previous" == "$TAG" ]] && previous=

        # The name comes from codenames.json and depends on the major number alone: stable within a major, different for every other major.
        # That holds while no word appears twice in a list, the two lists have no common divisor, and the major is below adjectives * nouns;
        # all three are checked, so a name can never be used twice (a release fails instead).
        names="$GITHUB_ACTION_PATH/codenames.json"
        major="${version%%.*}"
        read -r a n unique < <(jq -r '"\(.adjectives | length) \(.nouns | length) \((.adjectives | unique | length) == (.adjectives | length) and (.nouns | unique | length) == (.nouns | length))"' "$names")
        gcd() { local x=$1 y=$2; while ((y)); do set -- "$y" $((x % y)); x=$1 y=$2; done; echo "$x"; }
        if [[ "$unique" != true ]]; then
          echo "::error::codenames.json: a word appears twice in a list, so two majors could get the same name."
          exit 1
        fi
        if [[ "$(gcd "$a" "$n")" != 1 ]]; then
          echo "::error::codenames.json: the number of adjectives ($a) and nouns ($n) must have no common divisor, or majors would share names."
          exit 1
        fi
        if ((major >= a * n)); then
          echo "::error::Major $major has no name left: codenames.json offers $((a * n)) (adjectives x nouns). Add words so that the counts stay without a common divisor."
          exit 1
        fi
        codename=$(jq -r --argjson m "$major" '"\(.adjectives[$m % (.adjectives | length)]) \(.nouns[$m % (.nouns | length)])"' "$names")

        {
          echo "codename=$codename"
          echo "version=$version"
          echo "prerelease=$prerelease"
          echo "previous-tag=$previous"
        } >> "$GITHUB_OUTPUT"
        echo "Releasing $version \"$codename\" (prerelease: $prerelease, previous tag: ${previous:-none})"
