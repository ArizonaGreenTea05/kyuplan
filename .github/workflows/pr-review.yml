name: PR review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: pr-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Fork PRs get no secrets; drafts are reviewed once marked ready.
    if: github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
    env:
      CLAUDE_CODE_EFFORT_LEVEL: medium
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Own token: skips the Claude GitHub App token exchange, whose workflow validation
          # requires this file to be identical on the default branch.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: --model claude-sonnet-5-5
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request (gh pr view, gh pr diff; on a new push focus on the latest commits).
            Check correctness, edge cases, tests for every change, and the rules in AGENTS.md.
            Post one concise summary comment, and inline comments for concrete problems only.
