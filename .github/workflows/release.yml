name: Release

# A tag v<version>, e.g. v0.1 or v1.2.3, releases the whole framework in one version: the installer of every client (Windows, built with Inno Setup, the Linux package for Arch and the Android APK;
# further systems get a job beside "windows" that uploads its installer as Kyuplan-<platform>-<version>.<ext>) is built and goes
# into the Docker image of the server (API + web client), which offers them for download and as the update of the installed clients, and
# the image is pushed to ghcr.io/<owner>/kyuplan. The GitHub release carries the installers, the documentation archive and the SBOM of the image as well.
on:
  push:
    tags: ['v*']

# Read-only by default: the jobs that hold the signing secrets (windows, android, linux) never get a token that can write. The one job that pushes
# the image asks for packages: write and the one that publishes the release for contents: write.
permissions:
  contents: read

jobs:
  # A known vulnerability in a NuGet or npm dependency stops the release before anything is built (the image is scanned again below).
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # An unsigned installer cannot update itself and the clients then keep the old version without any error on the server, so a release
      # without the update key (and the Android keystore) fails here, before anything is built. Only the repository variable
      # ALLOW_UNSIGNED_RELEASE=true releases anyway. The expressions pass whether a secret exists, never its value.
      - name: Check that the release can be signed
        env:
          HAS_UPDATE_KEY: ${{ secrets.UPDATE_SIGNING_KEY != '' }}
          HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE != '' }}
          ALLOW_UNSIGNED: ${{ vars.ALLOW_UNSIGNED_RELEASE }}
        run: |
          missing=()
          [ "$HAS_UPDATE_KEY" = true ] || missing+=("UPDATE_SIGNING_KEY (the update signature of every installer)")
          [ "$HAS_ANDROID_KEYSTORE" = true ] || missing+=("ANDROID_KEYSTORE (the Android app would get a debug key and could not update an installed one)")
          [ ${#missing[@]} -eq 0 ] && exit 0
          if [ "$ALLOW_UNSIGNED" = true ]; then
            for m in "${missing[@]}"; do echo "::warning::Releasing without the secret $m: ALLOW_UNSIGNED_RELEASE is set."; done
            exit 0
          fi
          for m in "${missing[@]}"; do echo "::error::The secret $m is missing."; done
          echo "::error::Add the secrets (docs/deployment.md#releasing) or set the repository variable ALLOW_UNSIGNED_RELEASE to true to release unsigned."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: ./.github/actions/audit-dependencies

  windows:
    needs: audit
    # The test suite includes tests of the WPF client's Windows-only encrypted login file, and the installer is built here.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - id: v
        uses: ./.github/actions/release-version

      - name: Test
        run: dotnet test tests/Kyuplan.Tests -c Release

      # Self-contained: the installed client needs no .NET runtime on the computer.
      - name: Publish the WPF client
        run: >
          dotnet publish src/Kyuplan.Client.Wpf -c Release -r win-x64 --self-contained
          -p:Version=${{ steps.v.outputs.version }} -o artifacts/wpf

      # Authenticode signing (optional): it silences SmartScreen and lets the installed program run an update signed with its own certificate;
      # the update key below is what every release needs. Secrets: WINDOWS_CERT_PFX (the .pfx file, Base64) and WINDOWS_CERT_PASSWORD.
      - name: Sign the program
        shell: pwsh
        env:
          CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:CERT_PFX) { Write-Warning 'No WINDOWS_CERT_PFX secret: the installer is not code-signed (SmartScreen warns; the update key still signs it).'; exit 0 }
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\cert.pfx", [Convert]::FromBase64String($env:CERT_PFX))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          & $signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 artifacts\wpf\Kyuplan.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Inno Setup is part of the runner image.
      - name: Build the installer
        shell: pwsh
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          # Windows file versions have four numbers: 0.1 -> 0.1.0.0, 1.2.3-beta.1 -> 1.2.3.0
          $info = ((($env:VERSION -split '-')[0] + '.0.0') -split '\.')[0..3] -join '.'
          & $iscc "/DAppVersion=$env:VERSION" "/DVersionInfo=$info" `
            "/DSourceDir=$PWD\artifacts\wpf" "/DOutputDir=$PWD\artifacts\installer" installer\Kyuplan.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign the installer
        shell: pwsh
        env:
          CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not (Test-Path "$env:RUNNER_TEMP\cert.pfx")) { exit 0 }
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName | Select-Object -Last 1).FullName
          & $signtool sign /f "$env:RUNNER_TEMP\cert.pfx" /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 artifacts\installer\Kyuplan-windows-${{ steps.v.outputs.version }}.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Update key: the installed program runs an update whose signature (made here with the private key, checked with the public key built into
      # the program, installer/update-key.pub.pem) is valid, which needs no certificate. Secret UPDATE_SIGNING_KEY: the private key as PEM text.
      # This comes after the Authenticode signing, which changes the file.
      - name: Sign the installer with the update key
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::warning::No UPDATE_SIGNING_KEY secret: the installer has no update signature."
            exit 0
          fi
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/update-key.pem"
          installer="artifacts/installer/Kyuplan-windows-$VERSION.exe"
          openssl dgst -sha256 -sign "$RUNNER_TEMP/update-key.pem" -out "$installer.sig" "$installer"
          rm "$RUNNER_TEMP/update-key.pem"

      # Every client job uploads its installer as an artifact "installer-<platform>"; the image job collects them all.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-windows
          path: |
            artifacts/installer/Kyuplan-windows-${{ steps.v.outputs.version }}.exe
            artifacts/installer/Kyuplan-windows-${{ steps.v.outputs.version }}.exe.sig
          if-no-files-found: error

  # The Android app: an APK, signed with the release keystore so that a phone accepts it as the update of the installed one. Secrets:
  # ANDROID_KEYSTORE (the keystore file, Base64), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD. The audit job stops a release
  # without them unless ALLOW_UNSIGNED_RELEASE is set; the APK is then signed with a debug key, which installs but cannot update an app that was
  # signed with another key (Android refuses that).
  android:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21

      - id: v
        uses: ./.github/actions/release-version

      - name: Install the Android workload
        run: dotnet workload install android

      - name: Build and sign the app
        env:
          VERSION: ${{ steps.v.outputs.version }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Android orders versions by one whole number: 1.2.3 -> 1002003 (a prerelease suffix does not count).
          # Minor and patch each get three digits: a minor or patch of 1000 or more would overlap the next field and break the order.
          IFS=. read -r major minor patch <<< "${VERSION%%-*}"
          code=$(( major * 1000000 + minor * 1000 + ${patch:-0} ))
          signing=()
          if [ -n "$ANDROID_KEYSTORE" ]; then
            printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
            signing=(-p:AndroidKeyStore=true -p:AndroidSigningKeyStore="$RUNNER_TEMP/release.keystore" -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS"
                     -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD)
          else
            echo "::warning::No ANDROID_KEYSTORE secret: the APK is signed with a debug key and cannot update an app signed with another key."
          fi
          dotnet publish src/Kyuplan.Client.Android -c Release -p:Version="$VERSION" -p:ApplicationVersion="$code" "${signing[@]}" -o artifacts/android
          mkdir -p artifacts/installer
          cp artifacts/android/org.kyuplan.client-Signed.apk "artifacts/installer/Kyuplan-android-$VERSION.apk"

      # Same update key as the Windows installer (installer/update-key.pub.pem is built into the app); Android checks the APK's own signature on top.
      - name: Sign the app with the update key
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::warning::No UPDATE_SIGNING_KEY secret: the APK has no update signature."
            exit 0
          fi
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/update-key.pem"
          installer="artifacts/installer/Kyuplan-android-$VERSION.apk"
          openssl dgst -sha256 -sign "$RUNNER_TEMP/update-key.pem" -out "$installer.sig" "$installer"
          rm "$RUNNER_TEMP/update-key.pem"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-android
          path: |
            artifacts/installer/Kyuplan-android-${{ steps.v.outputs.version }}.apk
            artifacts/installer/Kyuplan-android-${{ steps.v.outputs.version }}.apk.sig
          if-no-files-found: error

  # The native Linux client as a pacman package for Arch Linux, built by makepkg in an Arch container (makepkg refuses to run as root).
  linux:
    needs: audit
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install the build tools
        run: pacman -Syu --noconfirm --needed base-devel git dotnet-sdk openssl sudo github-cli jq

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: v
        uses: ./.github/actions/release-version

      - name: Build the package
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          useradd -m builder
          chown -R builder "$GITHUB_WORKSPACE"
          # -d: the build tools are installed above; the run-time dependencies belong to the machines the package is installed on.
          su builder -c "cd '$GITHUB_WORKSPACE/deploy/arch' && KYUPLAN_VERSION='$VERSION' makepkg -f -d --noconfirm"
          mkdir -p artifacts/installer
          cp deploy/arch/kyuplan-*-any.pkg.tar.zst "artifacts/installer/Kyuplan-linux-$VERSION.pkg.tar.zst"

      # Same update key as the other installers (installer/update-key.pub.pem is built into the program).
      - name: Sign the package with the update key
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          if [ -z "$UPDATE_SIGNING_KEY" ]; then
            echo "::warning::No UPDATE_SIGNING_KEY secret: the package has no update signature and the installed clients will not install it."
            exit 0
          fi
          printf '%s\n' "$UPDATE_SIGNING_KEY" > "$RUNNER_TEMP/update-key.pem"
          installer="artifacts/installer/Kyuplan-linux-$VERSION.pkg.tar.zst"
          openssl dgst -sha256 -sign "$RUNNER_TEMP/update-key.pem" -out "$installer.sig" "$installer"
          rm "$RUNNER_TEMP/update-key.pem"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer-linux
          path: |
            artifacts/installer/Kyuplan-linux-${{ steps.v.outputs.version }}.pkg.tar.zst
            artifacts/installer/Kyuplan-linux-${{ steps.v.outputs.version }}.pkg.tar.zst.sig
          if-no-files-found: error

  # The documentation (Docusaurus, website/): the image carries the guides the server shows its users (the Dockerfile builds them itself), the
  # release carries all of them, the developer guide too, as one archive that any web server can serve at /docs/.
  docs:
    needs: audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: v
        uses: ./.github/actions/release-version

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build the documentation
        working-directory: website
        env:
          DOCS_REPO_REF: ${{ github.ref_name }}
        run: |
          npm ci --no-audit --no-fund
          node scripts/build-all.mjs

      - name: Pack the archive
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir -p artifacts/docs
          (cd website/build && zip -qr "$GITHUB_WORKSPACE/artifacts/docs/Kyuplan-docs-$VERSION.zip" .)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: documentation
          path: artifacts/docs/Kyuplan-docs-${{ steps.v.outputs.version }}.zip
          if-no-files-found: error

  # Builds, scans and pushes the image (the only job that may write packages) and keeps the SBOM for the publish job.
  image:
    needs: [windows, linux, android, docs] # add every further client job here
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      name: ${{ steps.image.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: v
        uses: ./.github/actions/release-version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          merge-multiple: true
          path: artifacts/installer

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: documentation
          path: artifacts/docs

      - name: Work out the image tags
        id: image
        env:
          VERSION: ${{ steps.v.outputs.version }}
          PRERELEASE: ${{ steps.v.outputs.prerelease }}
        run: |
          # Registry paths are lower case, owners are not.
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kyuplan"
          {
            echo "name=$image"
            echo "tags<<EOF"
            echo "$image:$VERSION"
            if [ "$PRERELEASE" = false ]; then
              [[ "$VERSION" == *.*.* ]] && echo "$image:${VERSION%.*}"  # 1.2.3 also moves 1.2
              [ "${VERSION%%.*}" != 0 ] && echo "$image:${VERSION%%.*}"  # 1.x moves 1; 0.x has no such line, its minors may break
              echo "$image:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Scan before anything is pushed: the same build for amd64 (the Dockerfile cross-compiles, both CPUs share the packages) is loaded
      # into the runner and checked with Trivy; a fixable HIGH or CRITICAL vulnerability (operating system packages of the base image
      # and the .NET dependencies alike) stops the release. Without a fix there is nothing to update to, so those do not.
      # The push below finds everything in the build cache.
      - name: Build the image for the scan
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/Kyuplan.Api/Dockerfile
          build-contexts: installer=artifacts/installer
          platforms: linux/amd64
          load: true
          tags: kyuplan-scan:${{ steps.v.outputs.version }}
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            DOCS_REPO_REF=${{ github.ref_name }}
            REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pinned to the commit (Dependabot keeps the comment's version in step): a scanner that runs in the release is a supply-chain risk itself.
      - name: Scan the image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kyuplan-scan:${{ steps.v.outputs.version }}
          severity: HIGH,CRITICAL
          # Vulnerabilities only: the secret scanner would stop the release on things that are no dependency.
          scanners: vuln
          ignore-unfixed: true
          exit-code: '1'
          # .trivyignore lists accepted findings (one CVE id per line, with the reason as a comment above it).
          trivyignores: .trivyignore

      # The software bill of materials of the image (CycloneDX), attached to the release.
      - name: Prepare the SBOM folder
        run: mkdir -p artifacts/sbom

      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kyuplan-scan:${{ steps.v.outputs.version }}
          format: cyclonedx
          output: artifacts/sbom/Kyuplan-sbom-${{ steps.v.outputs.version }}.cdx.json

      # The Dockerfile's "installer" stage is empty; here it is the folder with the installer built above.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/Kyuplan.Api/Dockerfile
          build-contexts: installer=artifacts/installer
          # The Dockerfile cross-compiles, so the second platform needs no emulation. One image for amd64 (PCs, servers, TrueNAS, Azure) and arm64 (Raspberry Pi, Apple silicon, Graviton/Cobalt).
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            DOCS_REPO_REF=${{ github.ref_name }}
            REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: artifacts/sbom/Kyuplan-sbom-${{ steps.v.outputs.version }}.cdx.json
          if-no-files-found: error

  # The GitHub release (the only job that may write the repository's contents; it holds no secret of its own and builds nothing).
  publish:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: v
        uses: ./.github/actions/release-version

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          merge-multiple: true
          path: artifacts/installer

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: documentation
          path: artifacts/docs

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: artifacts/sbom

      - uses: ./.github/actions/publish-release
        with:
          title: Kyuplan ${{ steps.v.outputs.version }} "${{ steps.v.outputs.codename }}"
          notes: |-
            Docker image (server, web client and the installers of the desktop apps in one): `${{ needs.image.outputs.name }}:${{ steps.v.outputs.version }}`

            ```
            docker pull ${{ needs.image.outputs.name }}:${{ steps.v.outputs.version }}
            ```

            The web client offers the desktop apps (the installers attached below) for download, and an installed app updates itself from the server. `Kyuplan-sbom-${{ steps.v.outputs.version }}.cdx.json` is the software bill of materials of the image (CycloneDX). The documentation is part of the server (Help in the web client and the desktop app, each user sees the guides they may read) and is attached as well (`Kyuplan-docs-${{ steps.v.outputs.version }}.zip`: every guide, the developer guide too). Settings, volumes and the TrueNAS setup are described in [docs/deployment.md](${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}/docs/deployment.md).
          prerelease: ${{ steps.v.outputs.prerelease }}
          previous-tag: ${{ steps.v.outputs.previous-tag }}
          files: artifacts/installer/* artifacts/docs/* artifacts/sbom/*
