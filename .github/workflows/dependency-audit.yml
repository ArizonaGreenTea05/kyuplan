name: Dependency audit

# Known vulnerabilities in the NuGet and npm dependencies (dotnet list package --vulnerable, npm audit). Besides every pull request it
# runs weekly, because a new advisory for an unchanged dependency is not triggered by any pull request. The release runs the same check
# first and scans the image as well (release.yml).
on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: dependency-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./.github/actions/audit-dependencies
