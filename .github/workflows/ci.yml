name: CI

# Every pull request builds and tests everything: the server (API), the clients (web and WPF) and the documentation.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Windows, because the solution includes the WPF client and the tests cover its Windows-only encrypted login file.
  build-test:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build server and clients
        run: dotnet build -c Release

      - name: Test
        run: dotnet test tests/Kyuplan.Tests -c Release

  # The tests marked PostgresFact (case-insensitive names, decimal amounts, the migrations) need a real server; locally they are skipped.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust # throwaway container, only reachable from this job
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      KYUPLAN_TEST_POSTGRES: Host=localhost;Username=postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Test against PostgreSQL
        run: dotnet test tests/Kyuplan.Tests -c Release --filter "FullyQualifiedName~PostgresApiTests"

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build the documentation
        working-directory: website
        run: |
          npm ci --no-audit --no-fund
          node scripts/build-all.mjs

  # Smoke tests of the web client in a real browser (Playwright, tests/ui) against the API in demo mode. Every page is opened as the
  # administrator, in a light and a dark desktop browser and (some pages) on a phone; the screenshots are the artifact "ui-screenshots".
  ui-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Build the API (it carries the web client)
        run: dotnet build src/Kyuplan.Api -c Release

      - name: Install Playwright
        working-directory: tests/ui
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Smoke tests
        working-directory: tests/ui
        env:
          KYUPLAN_UI_NO_BUILD: '1'
        run: npx playwright test

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-screenshots
          path: tests/ui/artifacts/screenshots
          if-no-files-found: warn

      - name: Upload the report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ui-report
          path: |
            tests/ui/artifacts/report
            tests/ui/artifacts/test-results
          if-no-files-found: warn

  # Screenshots of every page of the WPF client (tests/Kyuplan.WpfShots: the main window rendered offscreen against the API in demo mode).
  # Windows only, as WPF is; the screenshots are the artifact "wpf-screenshots".
  wpf-screenshots:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build the API and the screenshot tool
        run: |
          dotnet build src/Kyuplan.Api -c Release
          dotnet build tests/Kyuplan.WpfShots -c Release

      - name: Take the screenshots
        shell: pwsh
        env:
          ASPNETCORE_ENVIRONMENT: Development
          Spond__UseDemoData: 'true'
          Sync__Enabled: 'true'
          Accounts__InitialAdminUserName: admin
          Accounts__InitialAdminPassword: wpf-shots-password
          Api__MaxLoginFailuresPerAddress: '0'
          Setup__SettingsFile: ${{ runner.temp }}/no-settings/settings.json
          Database__ConnectionString: Data Source=${{ runner.temp }}/kyuplan.db
          Accounts__ConnectionString: Data Source=${{ runner.temp }}/accounts.db
        run: |
          $api = Start-Process dotnet -ArgumentList 'run --project src/Kyuplan.Api -c Release --no-build --no-launch-profile --urls http://127.0.0.1:5198' -PassThru -NoNewWindow
          try {
            $up = $false
            for ($i = 0; $i -lt 60 -and -not $up; $i++) {
              try { Invoke-WebRequest http://127.0.0.1:5198/healthz -UseBasicParsing | Out-Null; $up = $true } catch { Start-Sleep 2 }
            }
            if (-not $up) { throw 'The API did not start.' }
            # the first sync of the demo data: wait until the members are in the database
            $auth = @{ Authorization = 'Basic ' + [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes('admin:wpf-shots-password')) }
            $synced = $false
            for ($i = 0; $i -lt 60 -and -not $synced; $i++) {
              try { $synced = @(Invoke-RestMethod http://127.0.0.1:5198/api/members -Headers $auth).Count -gt 0 } catch { }
              if (-not $synced) { Start-Sleep 2 }
            }
            if (-not $synced) { throw 'The demo data was not synced.' }
            $exe = Get-ChildItem tests/Kyuplan.WpfShots/bin/Release -Recurse -Filter Kyuplan.WpfShots.exe | Select-Object -First 1
            $p = Start-Process $exe.FullName -ArgumentList 'http://127.0.0.1:5198','admin','wpf-shots-password','wpf-screenshots' -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Kyuplan.WpfShots failed with exit code $($p.ExitCode)." }
          } finally {
            Stop-Process -Id $api.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wpf-screenshots
          path: wpf-screenshots
          if-no-files-found: warn

  # The image the server ships in (API + web client + documentation), built but not pushed. One platform is enough here:
  # the Dockerfile cross-compiles, and the release builds both. Its "installer" stage is empty without the release's installers.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: src/Kyuplan.Api/Dockerfile
          platforms: linux/amd64
          push: false
